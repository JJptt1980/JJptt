name: Mirror to killnopig.github.io/JJptt

# The GitHub account was renamed from killnopig to JJptt1980. The web version's
# settings and FACT history live in localStorage on the origin
# https://killnopig.github.io, so the site is mirrored into the JJptt/ folder of
# the killnopig/killnopig.github.io user-site repo (the relay worker allows both
# origins). Folders the website never serves are left out.
#
# Secret KILLNOPIG_PAGES_TOKEN: fine-grained token of the killnopig account,
# repository access limited to killnopig/killnopig.github.io, Contents: read and write.

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-pages
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout JJptt
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: src

      - name: Checkout killnopig.github.io
        uses: actions/checkout@v4
        with:
          repository: killnopig/killnopig.github.io
          token: ${{ secrets.KILLNOPIG_PAGES_TOKEN }}
          path: site

      - name: Copy site into JJptt/
        run: |
          mkdir -p site/JJptt
          rsync -a --delete \
            --exclude '.git' --exclude '.github' --exclude '.claude' \
            --exclude '/native-host/' --exclude '/mobile/' --exclude '/test/' \
            --exclude '/tools/' --exclude '/worker/' \
            src/ site/JJptt/

      - name: Commit and push
        working-directory: site
        env:
          SRC_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A JJptt
          if git diff --cached --quiet; then
            echo "No changes to mirror."
            exit 0
          fi
          git commit -m "Mirror JJptt ${SRC_SHA::7}"
          for i in 1 2 3 4 5; do
            git push && exit 0
            sleep $((i * 5))
            git pull --rebase
          done
          exit 1
